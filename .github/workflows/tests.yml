name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04      # ubuntu-latest (26.04) has no Python 3.9, the oldest version the package supports
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,download]"
      # without the data the release tests are skipped: this checks the install, the imports and the download helper
      - run: pytest -q -rs
      - run: python -m compileall -q badataset examples calibration
      - run: badataset-download --help
