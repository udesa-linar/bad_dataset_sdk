%YAML:1.0 # need to specify the file type at the top!

cam:
  enabled: true
  # cam0/cam1 = the stereo pair /cam1+/cam5. The monocular /cam2, /cam3, /cam4 (20 Hz, own tick
  # clocks, constant stamp offset absorbed by do_calib_dt) are configured below as cam2..cam4
  # and enabled by raising max_n. Measured on 60 s of loop_sanisidro split_01 (n_pts 500) they
  # add nothing to the stereo+lidar+wheel+GNSS solution (2.4 m / 0.2 m rms either way) and cost
  # a lot: stereo only ~1.9x real time, +cam2+cam3 ~0.5x, all five ~0.2x. They also need a
  # longer clone window or the GNSS ENU alignment never gets enough interpolable fixes:
  # est.window_size 3.0 for one or two extra cameras, 6.0 for all three (1.0 is fine for stereo).
  max_n: 2                # number of cameras (cam0..cam{max_n-1})
  use_stereo: true        # track the pair jointly (stereo KLT); the pair shares ONE time offset
  stereo_pair: [0, 1]     # camera ids forming stereo pairs, flattened [a0, b0, a1, b1, ...]
  do_calib_ext: false   # estimate camera-IMU extrinsics online
  do_calib_int: false   # estimate intrinsics + distortion online
  do_calib_dt: false   # estimate camera-IMU time offset online
  n_pts: 1500             # target number of tracked KLT features per image. 500 halves the camera
                          # time and looked equivalent on 60 s, but on 5 min of loop_sanisidro the
                          # weaker pre-GNSS estimate misaligned the ENU frame and the run diverged.
  fast: 30                # FAST corner threshold for new feature extraction
  grid_x: 15              # extraction grid (columns) to spread features over the image
  grid_y: 15              # extraction grid (rows)
  min_px_dist: 15         # minimum distance between features [px]
  knn: 0.65               # descriptor ratio test; unused (MINS always uses the KLT tracker)
  downsample: true        # halve the images (intrinsics/resolution below are scaled automatically)
  histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE
  max_slam: 0             # SLAM features kept in the state (0 = MSCKF only)
  max_msckf: 50           # max MSCKF features used per update
  feat_rep: "GLOBAL_FULL_INVERSE_DEPTH" # landmark parametrization (GLOBAL_3D or GLOBAL_FULL_INVERSE_DEPTH)
  init_cov_dt: 1e-4       # initial variance of the time offset [s^2]
  init_cov_ex_o: 1e-4     # initial variance of the extrinsic rotation [rad^2]
  init_cov_ex_p: 1e-4     # initial variance of the extrinsic translation [m^2]
  init_cov_in_k: 1e-2     # initial variance of fx, fy [px^2]
  init_cov_in_c: 1e-1     # initial variance of cx, cy [px^2]
  init_cov_in_r: 1e-6     # initial variance of the distortion coefficients
  sigma_px: 2             # pixel measurement noise std (on the downsampled image) [px]
  chi2_mult: 1            # multiplier of the 95% chi2 gating threshold

  # feature related (triangulation acceptance)
  fi_min_dist: 0.25       # min feature depth [m]
  fi_max_dist: 150        # max feature depth [m]
  fi_max_baseline: 2000   # max depth/baseline ratio (large = accept far, poorly-triangulated points)
  fi_max_cond_number: 10000 # max condition number of the triangulation system

  # ==================================================================
  # ==================================================================

cam0:
  timeoffset: 0.0   # initial time offset t_imu = t_cam + timeoffset [s] (shared by the pair)
  T_imu_cam: # rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.01413988,  0.02064345,  0.99968691,  1.68649477]
    - [ 0.99970176, -0.01961716,  0.01454518, -0.19599643]
    - [ 0.01991128,  0.99959443, -0.02035990, -0.92684643]
    - [ 0.00000000,  0.00000000,  0.00000000,  1.00000000]
  distortion_coeffs: [-0.0239943705, 0.0424311049, 0.0002395735, -0.0027467533]
  # distortion_model: radtan (k1 k2 p1 p2) or equidistant (k1..k4)
  distortion_model: radtan
  intrinsics: [726.885609, 724.830262, 595.728684, 516.755976]   # fx fy cx cy (full res)
  resolution: [1224, 1026] # width height (full res)
  topic: "/cam1/image_raw/compressed"
  compressed: true         # sensor_msgs/CompressedImage

cam1:
  timeoffset: 0.0   # ignored with use_stereo (overwritten by the cam0 offset)
  T_imu_cam: # rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.01056028,  0.01582233,  0.99981905,  1.68453099]
    - [ 0.99937258, -0.03363795,  0.01108789,  0.34443076]
    - [ 0.03380730,  0.99930883, -0.01545717, -0.91770486]
    - [ 0.00000000,  0.00000000,  0.00000000,  1.00000000]
  distortion_coeffs: [-0.0266167213, 0.0471526280, 0.0002366212, -0.0029369004]
  distortion_model: radtan
  intrinsics: [727.826821, 726.572930, 612.897135, 509.533564]
  resolution: [1224, 1026]
  topic: "/cam5/image_raw/compressed"
  compressed: true
# Monocular cameras. Intrinsics/distortion from the lidar-camera calibration (calib_camN.json,
# plumb_bob = radtan k1 k2 p1 p2, computed on the published 1224x1026 / 1024x770 JPEGs).
# T_imu_cam = inv(T_lidar_imu) * T_lidar_camN with the transforms of extrinsecas.launch (the same
# chain reproduces the Kalibr stereo entries above to ~3 deg / 9 cm). Optical axes in the IMU
# frame: cam2 left-forward (0.46,-0.89,0.03), cam3 right-forward (0.40,0.90,0.18), cam4 rear (-1,0,0).
cam2:
  timeoffset: 0.0
  T_imu_cam:
