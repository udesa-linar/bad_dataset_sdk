%YAML:1.0 # need to specify the file type at the top!

# "MINS_DIR" is replaced by the installed package path (install/mins/share/mins), so
# MINS_DIR/../../../../outputs is <workspace>/outputs. Any key in any config file can be
# overridden with a ROS param named <section>_<key>, e.g.
#   --ros-args -p sys_path_bag:=... -p sys_verbosity:=2 -p gps_noise_z:=1.0
sys:
  verbosity: 1            # 0 = everything ... 5 = silent (PRINT0..PRINT4 levels)
  save_timing: true       # write per-sensor processing times
  path_timing: "MINS_DIR/../../../../outputs/tmp/0.time"
  save_state: false       # full state/std dump; only works with the simulator
  path_state: "MINS_DIR/../../../../outputs/tmp/0/"  # also where save_prints writes
  save_trajectory: true   # IMU pose + covariance per clone (+ <name>_calib.txt/.yaml calibration)
  path_trajectory: "MINS_DIR/../../../../outputs/tmp/0.txt"
  save_prints: false      # also write the console prints to a file in path_state
  exp_id: 0               # experiment label (only printed)

  path_bag: "/data/calib_bien/cam_imu_calib/full.bag" # bag played by the `bag` node
  bag_start: 0            # skip this many seconds from the start of the bag [s]
  bag_durr: -1            # duration to play [s] (-1 = until the end)
