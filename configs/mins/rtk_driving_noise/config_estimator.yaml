%YAML:1.0 # need to specify the file type at the top!

est:
  gravity_mag: 9.7969     # gravity magnitude [m/s^2]. Local value at San Isidro, Buenos Aires
                          # is ~9.797 (https://www.sensorsone.com/local-gravity-calculator/)
  clone_freq: 20          # nominal rate of IMU pose clones in the sliding window [Hz]
  window_size: 1.0        # sliding-window length [s] (#clones = window_size * clone_freq + 1)
  intr_order: 3           # order of the pose polynomial used to interpolate between clones (odd)
  intr_error_mlt: 3       # multiplier of the interpolation-error covariance added to measurements
  intr_error_ori_thr: 0.007 # dynamic cloning - raise clone Hz if predicted orientation interp.
                          #   error exceeds this [rad]
  intr_error_pos_thr: 0.003 # same for position [m]
  intr_error_thr_mlt: 0.5 # scales both thresholds above
  dt_extrapolation: 0.01  # max time a measurement may fall outside the clone window and still be
                          #   used (by extrapolation) [s]

  use_imu_res: true       # interpolate poses between clones with IMU integration (false = polynomial)
  use_imu_cov: true       # camera only - add IMU-preintegration covariance for interpolated poses
  use_pol_cov: false      # camera only - add polynomial-fit covariance instead (mutually exclusive)
  dynamic_cloning: true   # adapt clone Hz to motion using the intr_ori/intr_pos tables below

# Slope of the polynomial pose interpolation error based on acceleration
# order: 1 3 5 7 9
# The smallest Hz row is the FLOOR dynamic cloning can pick. Rows below 10 Hz are removed:
# at 4-5 Hz (standstill) the window holds fewer clones than the order-3 interpolation
# needs (seen as "[State] Cannot add polynomial. #clones: 3, #required: 4"), GNSS/cam
# updates stall at the stop->go transition and the state drifted >100 m before snapping
# back. A 10 Hz floor costs little: cloning already averages ~9 Hz and the run has >3x
# real-time margin.
intr_ori:
  Hz_10: [0.00288, 0.00126, 0.00108, 0.00102, 0.00102]
  Hz_15: [0.00138, 0.00066, 0.00063, 0.00069, 0.00087]
  Hz_20: [0.00084, 0.00012, 0.00006, 0.00003, 0.00003]
  Hz_25: [0.00051, 0.00012, 0.00009, 0.00009, 0.00009]
  Hz_30: [0.00036, 0.00006, 0.00003, 0.00003, 0.00003]
intr_pos:
  Hz_10: [0.00312, 0.00087, 0.00072, 0.00066, 0.00066]
  Hz_15: [0.00144, 0.00021, 0.00018, 0.00015, 0.00015]
  Hz_20: [0.00084, 0.00009, 0.00006, 0.00003, 0.00003]
  Hz_25: [0.00054, 0.00006, 0.00003, 0.00003, 0.00003]
  Hz_30: [0.00036, 0.00003, 0.00003, 0.00003, 0.00000]
